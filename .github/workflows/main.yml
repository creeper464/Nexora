
name: NEXORA Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NEXORA
        run: npm run build
      - name: Upload NEXORA Build Files
        uses: actions/upload-artifact@v4
        with:
          name: nexora-build
          path: dist/
          retention-days: 7
